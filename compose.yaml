# FPOne Intranet: Ambiente Completo de Produção para Servidor Debian Linux.
# Arquitetura Multi-Subdomínio com Traefik v3, MinIO S3, PostgreSQL 16 e Next.js 16 Standalone.
# Segredos e subdomínios vêm do arquivo .env (fora do Git). Ver .env.example.

name: fpone

services:
  # ----------------------------------------------------------------------------
  # 1. Proxy Reverso & Gerenciamento Multi-Subdomínio (Traefik v3)
  # ----------------------------------------------------------------------------
  # Único serviço com portas 80/443 expostas publicamente.
  # - Roteia subdomínio da Intranet (APP_DOMAIN) -> web:3000
  # - Roteia subdomínio de Arquivos/S3 (S3_DOMAIN) -> minio:9000
  # - Roteia subdomínio do Console MinIO (MINIO_CONSOLE_DOMAIN) -> minio:9001
  # - Roteia subdomínio do Painel Traefik (TRAEFIK_DOMAIN) -> api@internal
  # - Emite e renova certificados SSL/TLS automaticamente para cada subdomínio via Let's Encrypt
  proxy:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      # Provedor Docker com descoberta dinâmica via labels
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Entrypoints de rede
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.traefik.address=:8080"
      # Dashboard de gerenciamento e métricas da API
      - "--api.dashboard=true"
      - "--api.insecure=false"
      # Resolução de certificados automáticos (Let's Encrypt / ACME)
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@fazendaprogresso.com.br}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    labels:
      - "traefik.enable=true"
      # --- Subdomínio do Traefik Dashboard (HTTP) ---
      - "traefik.http.routers.traefik-dashboard-http.rule=Host(`${TRAEFIK_DOMAIN:-traefik.localhost}`)"
      - "traefik.http.routers.traefik-dashboard-http.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard-http.service=api@internal"
      - "traefik.http.routers.traefik-dashboard-http.middlewares=traefik-auth"
      # --- Subdomínio do Traefik Dashboard (HTTPS com SSL) ---
      - "traefik.http.routers.traefik-dashboard-https.rule=Host(`${TRAEFIK_DOMAIN:-traefik.localhost}`)"
      - "traefik.http.routers.traefik-dashboard-https.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard-https.tls=true"
      - "traefik.http.routers.traefik-dashboard-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard-https.service=api@internal"
      - "traefik.http.routers.traefik-dashboard-https.middlewares=traefik-auth"
      # Acesso interno direto pela porta 8080
      - "traefik.http.routers.traefik-dash-direct.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
      - "traefik.http.routers.traefik-dash-direct.entrypoints=traefik"
      - "traefik.http.routers.traefik-dash-direct.service=api@internal"
      - "traefik.http.routers.traefik-dash-direct.middlewares=traefik-auth"
      # Usuário local de administração do Traefik (padrão: admin / Admin@FPOne2026!)
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_BASIC_AUTH:-admin:$$2y$$05$$eWpL9B98b8b7hN5pCqU.yO0rWj7Y6A1qZ4V3n7E4mK9R5G0bU3P1y}"

  # ----------------------------------------------------------------------------
  # 2. Aplicação FPOne Intranet (Next.js 16 App Router Standalone)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-Fazenda Progresso}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-fpone-files}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-Admin@FPOne2026!}
      # URL pública do S3 para links pré-assinados (usa subdomínio S3_DOMAIN)
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://${S3_DOMAIN:-s3.localhost}}
      DEMO_MODE: ${DEMO_MODE:-false}
      FEATURE_AI_SEARCH: ${FEATURE_AI_SEARCH:-false}
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-24}
      AUTH_SECRET: ${AUTH_SECRET}
      # URL canônica da aplicação para redirecionamentos pós-login (usa APP_DOMAIN)
      AUTH_URL: ${AUTH_URL:-http://${APP_DOMAIN:-intranet.localhost}}
      AUTH_TRUST_HOST: "true"
      TRUST_PROXY: "true"
      CPF_PEPPER: ${CPF_PEPPER}
      TZ: America/Bahia
      # Usuário Master Local de Gerenciamento da Aplicação
      MASTER_ADMIN_USERNAME: ${MASTER_ADMIN_USERNAME:-admin}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD:-Admin@FPOne2026!}
      MASTER_ADMIN_EMAIL: ${MASTER_ADMIN_EMAIL:-admin@fazendaprogresso.com.br}
    labels:
      - "traefik.enable=true"
      # --- Subdomínio da Aplicação FPOne (HTTP) ---
      - "traefik.http.routers.web-http.rule=Host(`${APP_DOMAIN:-intranet.localhost}`) || Host(`localhost`)"
      - "traefik.http.routers.web-http.entrypoints=web"
      - "traefik.http.routers.web-http.service=web-service"
      - "traefik.http.routers.web-http.priority=1"
      # --- Subdomínio da Aplicação FPOne (HTTPS com SSL) ---
      - "traefik.http.routers.web-https.rule=Host(`${APP_DOMAIN:-intranet.localhost}`)"
      - "traefik.http.routers.web-https.entrypoints=websecure"
      - "traefik.http.routers.web-https.tls=true"
      - "traefik.http.routers.web-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-https.service=web-service"
      - "traefik.http.routers.web-https.priority=1"
      # Encaminhamento para a porta interna 3000
      - "traefik.http.services.web-service.loadbalancer.server.port=3000"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------------------------
  # 3. Armazenamento de Objetos S3 & Console Visual (MinIO)
  # ----------------------------------------------------------------------------
  minio:
    image: ${MINIO_IMAGE:-elestio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      # Porta direta mantida como fallback para acesso local/rede interna
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      # Usuário local de administração do MinIO
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Admin@FPOne2026!}
      MINIO_BROWSER: "on"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    labels:
      - "traefik.enable=true"
      # --- 1. Subdomínio da API S3 / Downloads (Porta 9000) ---
      # HTTP
      - "traefik.http.routers.minio-s3-http.rule=Host(`${S3_DOMAIN:-s3.localhost}`) || PathPrefix(`/${S3_BUCKET:-fpone-files}`)"
      - "traefik.http.routers.minio-s3-http.entrypoints=web"
      - "traefik.http.routers.minio-s3-http.service=minio-s3"
      - "traefik.http.routers.minio-s3-http.priority=100"
      # HTTPS com SSL
      - "traefik.http.routers.minio-s3-https.rule=Host(`${S3_DOMAIN:-s3.localhost}`) || (Host(`${APP_DOMAIN:-intranet.localhost}`) && PathPrefix(`/${S3_BUCKET:-fpone-files}`))"
      - "traefik.http.routers.minio-s3-https.entrypoints=websecure"
      - "traefik.http.routers.minio-s3-https.tls=true"
      - "traefik.http.routers.minio-s3-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-s3-https.service=minio-s3"
      - "traefik.http.routers.minio-s3-https.priority=100"
      - "traefik.http.services.minio-s3.loadbalancer.server.port=9000"
      # --- 2. Subdomínio do Console Web Administrativo do MinIO (Porta 9001) ---
      # HTTP
      - "traefik.http.routers.minio-console-http.rule=Host(`${MINIO_CONSOLE_DOMAIN:-minio.localhost}`)"
      - "traefik.http.routers.minio-console-http.entrypoints=web"
      - "traefik.http.routers.minio-console-http.service=minio-console"
      # HTTPS com SSL
      - "traefik.http.routers.minio-console-https.rule=Host(`${MINIO_CONSOLE_DOMAIN:-minio.localhost}`)"
      - "traefik.http.routers.minio-console-https.entrypoints=websecure"
      - "traefik.http.routers.minio-console-https.tls=true"
      - "traefik.http.routers.minio-console-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console-https.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  # ----------------------------------------------------------------------------
  # 4. Inicializador Idempotente do Bucket S3 (MinIO Client - mc)
  # ----------------------------------------------------------------------------
  # Cria o bucket privado no bootstrap de forma idempotente via MinIO Client (mc)
  minio-init:
    image: ${MINIO_MC_IMAGE:-chainguard/minio-client:latest}
    restart: on-failure
    environment:
      MC_HOST_myminio: http://${MINIO_ROOT_USER:-admin}:${MINIO_ROOT_PASSWORD:-Admin@FPOne2026!}@minio:9000
    command: ["mb", "--ignore-existing", "myminio/${S3_BUCKET:-fpone-files}"]
    depends_on:
      minio:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 5. Banco de Dados Relacional (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fpone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fpone}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fpone} -d $${POSTGRES_DB:-fpone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 6. Backup Automatizado Diário (PostgreSQL + MinIO S3 Sync)
  # ----------------------------------------------------------------------------
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    environment:
      TZ: America/Bahia
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-fpone}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-fpone}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-fpone-files}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-Admin@FPOne2026!}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------------------------
  # 7. Ferramentas CLI e Manutenção Sob Demanda (Profile: tools)
  # ----------------------------------------------------------------------------
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    profiles: ["tools"]
    user: root
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fpone}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fpone}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-fpone}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fpone}_test
      MINIO_ENDPOINT: http://minio:9000
      CPF_PEPPER: ${CPF_PEPPER}
      AUTH_SECRET: ${AUTH_SECRET}
      TZ: America/Bahia
    volumes:
      - ./prisma:/app/prisma
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  minio-data:
  traefik-certificates:
