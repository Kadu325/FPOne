# FPOne Intranet: ambiente completo (§182).
# Só o `proxy` expõe portas; os demais serviços ficam na rede interna.
# Segredos vêm do .env (fora do Git). Ver .env.example.
# MinIO foi substituído pelo Garage (S3-compatível, leve, sem componente init temporário quebrado).

name: fpone

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-Fazenda Progresso}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
    restart: unless-stopped
    # LDAP_*, AUTH_SESSION_HOURS, LOGIN_*, TRUST_PROXY, GLPI_TICKET_URL, IT_SUPPORT_* vêm daqui.
    # O .env nunca entra na imagem (.dockerignore). `environment` abaixo tem precedência.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GARAGE_ENDPOINT: http://garage:3900
      MINIO_ENDPOINT: http://garage:3900
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # URL pública (a do navegador) para assinar downloads; o Caddy repassa /<bucket>/* ao Garage.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-${AUTH_URL:-https://localhost}}
      DEMO_MODE: ${DEMO_MODE:-false}
      FEATURE_AI_SEARCH: ${FEATURE_AI_SEARCH:-false}
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-24}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-https://localhost}
      AUTH_TRUST_HOST: "true"
      # Atrás do Caddy: habilita o limite de tentativas por IP do login AD.
      TRUST_PROXY: "true"
      CPF_PEPPER: ${CPF_PEPPER}
      TZ: America/Bahia
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy

  # Operação sob demanda (não sobe com `up`). Exemplos:
  #   docker compose run --rm tools npm run db:deploy
  #   docker compose run --rm tools npm run db:migrate -- --name <nome>
  #   docker compose run --rm tools npm run admin:bootstrap -- --matricula 000123
  #   docker compose run --rm tools npm run test:integration
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    profiles: ["tools"]
    user: root
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      GARAGE_ENDPOINT: http://garage:3900
      MINIO_ENDPOINT: http://garage:3900
      CPF_PEPPER: ${CPF_PEPPER}
      AUTH_SECRET: ${AUTH_SECRET}
      TZ: America/Bahia
    volumes:
      - ./prisma:/app/prisma
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Garage: armazenamento de objetos S3-compatível (substituto do MinIO).
  # Nó único (replication_factor=1). Configurado via garage.toml gerado no entrypoint.
  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3903/health 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Bootstrap idempotente: configura layout, cria bucket e chave de acesso.
  garage-init:
    image: curlimages/curl:latest
    restart: on-failure
    volumes:
      - ./docker/garage-init.sh:/garage-init.sh:ro
      - garage-secrets:/run/garage-secrets
    environment:
      GARAGE_BUCKET: ${S3_BUCKET:-fpone-files}
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_KEY_NAME: fpone-app
    command: ["sh", "/garage-init.sh"]
    depends_on:
      garage:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      S3_BUCKET: ${S3_BUCKET}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    environment:
      TZ: America/Bahia
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy

volumes:
  db-data:
  garage-meta:
  garage-data:
  garage-secrets:
  caddy-data:
  caddy-config:
